<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>97% pie — GIF master</title>
<style>
  @font-face {
    font-family: "Montserrat";
    src: url("../public/fonts/Montserrat-ExtraBold.ttf") format("truetype");
    font-weight: 800;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("../public/fonts/Montserrat-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("../public/fonts/Montserrat-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  @font-face {
    font-family: "Kilimanjaro Sans";
    src: url("../public/fonts/KilimanjaroSans.otf") format("opentype");
    font-weight: 400 900;
  }
  /* Transparent so captures (omitBackground) carry a real alpha channel. */
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { width: 780px; height: 640px; }
  text { font-family: "Montserrat", sans-serif; }
  #headline text { font-family: "Kilimanjaro Sans", sans-serif; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 780 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#391129" flood-opacity="0.25"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#391129" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ============ PIE ============ -->
  <g id="pieGroup">
    <!-- maroon 97% wedge (plum outline ring behind the white stroke) -->
    <path id="wedgeOutline" fill="#5D1B4E" stroke="#5D1B4E" stroke-width="13" filter="url(#softShadow)"/>
    <path id="wedge" fill="#5D1B4E" stroke="#ffffff" stroke-width="7"/>
    <!-- cream 3% slice -->
    <g id="creamSlice">
      <path id="creamOutline" fill="#F2E6D8" stroke="#5D1B4E" stroke-width="13"/>
      <path id="creamPath" fill="#F2E6D8" stroke="#ffffff" stroke-width="7"/>
      <text id="threePct" x="0" y="0" font-size="30" font-weight="800" fill="#152638" text-anchor="middle">3%</text>
      <text id="buyIt" x="0" y="0" font-size="17" font-weight="500" fill="#152638" text-anchor="middle">Buy it</text>
      <image id="purplePeople" href="../public/Gif Assets/purple people vector.png" width="34" height="37"/>
    </g>

    <!-- 97% copy inside wedge -->
    <g id="wedgeCopy">
      <text id="ninetySevenPct" x="150" y="285" font-size="62" font-weight="800" fill="#ffffff" text-anchor="middle">0%</text>
      <text x="150" y="319" font-size="19" font-weight="500" fill="#ffffff" text-anchor="middle">Don&#8217;t see the</text>
      <text x="150" y="343" font-size="19" font-weight="500" fill="#ffffff" text-anchor="middle">problem (yet)</text>
    </g>
    <image id="crowd" href="../public/Gif Assets/white people vector.png" x="125" y="428" width="134" height="129" opacity="0.4"/>

    <!-- centre badge -->
    <g id="badge">
      <circle cx="0" cy="0" r="72" fill="none" stroke="#5D1B4E" stroke-width="13" filter="url(#softShadow)"/>
      <circle id="badgeCircle" cx="0" cy="0" r="72" fill="#451040" stroke="#ffffff" stroke-width="7"/>
      <image href="../public/Gif Assets/middle white people vector.png" x="-29" y="-60" width="58" height="56"/>
      <text x="0" y="28" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">100</text>
      <text x="0" y="52" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">People</text>
    </g>
  </g>

  <!-- ============ HEADLINE ============ -->
  <g id="headline">
    <text x="424" y="50" font-size="39" font-weight="900" fill="#152638" text-anchor="start">Say you&#8217;re selling</text>
    <text x="424" y="96" font-size="39" font-weight="900" fill="#152638" text-anchor="start">medicine for ulcers.</text>
  </g>

  <!-- ============ CARD 1 : 03 ============ -->
  <path id="arrow1" d="M 386 210 H 404" stroke="#152638" stroke-width="4" fill="none"/>
  <path id="arrow1head" d="M 398 200 L 414 210 L 398 220 Z" fill="#152638"/>
  <g id="card1">
    <rect x="424" y="148" width="350" height="122" rx="10" fill="#ffffff" stroke="#E4D2C6" stroke-width="2" filter="url(#cardShadow)"/>
    <path d="M 424 158 a 10 10 0 0 1 10 -10 h 330 a 10 10 0 0 1 10 10 v 2 h -350 z" fill="#F2E6D8"/>
    <text id="count03" x="448" y="228" font-size="56" font-weight="800" fill="#152638">00</text>
    <rect x="448" y="240" width="66" height="5" fill="#152638"/>
    <text x="538" y="200" font-size="19" font-weight="800" fill="#152638">Ready to Take Action</text>
    <text x="538" y="226" font-size="13.5" font-weight="500" fill="#4a4a4a">Know they have ulcers and</text>
    <text x="538" y="246" font-size="13.5" font-weight="500" fill="#4a4a4a">buy immediately.</text>
  </g>

  <!-- ============ CARD 2 : 97 ============ -->
  <path id="arrow2" d="M 392 440 H 420" stroke="#152638" stroke-width="4" fill="none"/>
  <path id="arrow2head" d="M 414 430 L 430 440 L 414 450 Z" fill="#152638"/>
  <g id="card2">
    <rect x="446" y="382" width="328" height="122" rx="10" fill="#ffffff" stroke="#E4D2C6" stroke-width="2" filter="url(#cardShadow)"/>
    <path d="M 446 392 a 10 10 0 0 1 10 -10 h 308 a 10 10 0 0 1 10 10 v 2 h -328 z" fill="#5D1B4E"/>
    <text id="count97" x="468" y="462" font-size="56" font-weight="800" fill="#5D1B4E">00</text>
    <rect x="468" y="474" width="66" height="5" fill="#5D1B4E"/>
    <text x="556" y="436" font-size="19" font-weight="800" fill="#5D1B4E">Experiencing Pain</text>
    <text x="556" y="460" font-size="13.5" font-weight="500" fill="#4a4a4a">Have stomach pain, but they</text>
    <text x="556" y="480" font-size="13.5" font-weight="500" fill="#4a4a4a">don&#8217;t know ulcers cause it.</text>
  </g>
</svg>

<script>
/* ---------- geometry ---------- */
const CX = 310, CY = 355, R = 268;           // pie origin (badge sits here)
const BADGE = { x: CX, y: CY };

// clock angle (deg, 0 = 12 o'clock, clockwise) -> point
function pt(cx, cy, r, clockDeg) {
  const rad = (clockDeg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}
function sector(cx, cy, r, a0, a1) {
  const [x0, y0] = pt(cx, cy, r, a0);
  const [x1, y1] = pt(cx, cy, r, a1);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`;
}

const CREAM_A0 = -10, CREAM_A1 = 18;         // cream slice near 12 o'clock
const WEDGE_A0 = 141;                         // maroon starts bottom-right
/* Overlap 1.5° under the cream slice (drawn on top) so the two sectors'
   edges can't show a mis-registration step at the seam. */
const WEDGE_A1 = 360 + CREAM_A0 + 1.5;

/* ---------- easings ---------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeOutBack = p => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, a, b) => clamp01((t - a) / (b - a));

/* ---------- static positioning ---------- */
const creamMid = (CREAM_A0 + CREAM_A1) / 2;
const [tx, ty] = pt(CX, CY, R * 0.66, creamMid);
const threePct = document.getElementById('threePct');
const buyIt   = document.getElementById('buyIt');
const pp      = document.getElementById('purplePeople');
threePct.setAttribute('x', tx); threePct.setAttribute('y', ty - 10);
buyIt.setAttribute('x', tx);   buyIt.setAttribute('y', ty + 14);
const [px, py] = pt(CX, CY, R * 0.52, creamMid);
pp.setAttribute('x', px - 17); pp.setAttribute('y', py - 8);

const badge = document.getElementById('badge');

/* ---------- the deterministic driver ---------- */
function seek(t) {
  /* 1. headline 0–500 */
  const h = easeOut(seg(t, 0, 500));
  const hl = document.getElementById('headline');
  hl.setAttribute('opacity', h);
  hl.setAttribute('transform', `translate(0 ${(1 - h) * -18})`);

  /* 2. wedge sweep 150–1350 */
  const w = easeOut(seg(t, 150, 1350));
  const a1 = WEDGE_A0 + (WEDGE_A1 - WEDGE_A0) * w;
  const wedgeD = sector(CX, CY, R, WEDGE_A0, Math.max(a1, WEDGE_A0 + 0.5));
  document.getElementById('wedge').setAttribute('d', wedgeD);
  document.getElementById('wedgeOutline').setAttribute('d', wedgeD);

  /* 3. cream slice 1050–1500 (pop) */
  const c = easeOutBack(seg(t, 1050, 1500));
  const cs = document.getElementById('creamSlice');
  cs.setAttribute('opacity', clamp01(seg(t, 1050, 1300)));
  const creamD = sector(CX, CY, R, CREAM_A0, CREAM_A1);
  document.getElementById('creamPath').setAttribute('d', creamD);
  document.getElementById('creamOutline').setAttribute('d', creamD);
  cs.setAttribute('transform',
    `translate(${CX} ${CY}) scale(${0.6 + 0.4 * clamp01(c)}) translate(${-CX} ${-CY})`);

  /* 4. badge pop 1350–1850 */
  const b = clamp01(seg(t, 1350, 1850));
  const bs = b === 0 ? 0 : easeOutBack(b);
  badge.setAttribute('transform', `translate(${BADGE.x} ${BADGE.y}) scale(${bs})`);
  badge.setAttribute('opacity', clamp01(seg(t, 1350, 1500)));

  /* 5. 97% count + copy 1500–2600 */
  const n = easeOut(seg(t, 1500, 2600));
  document.getElementById('ninetySevenPct').textContent = Math.round(97 * n) + '%';
  const wcOp = clamp01(seg(t, 1500, 1900));
  document.getElementById('wedgeCopy').setAttribute('opacity', wcOp);
  document.getElementById('crowd').setAttribute('opacity', 0.4 * clamp01(seg(t, 1800, 2300)));

  /* 6. arrow 1 draw 2100–2500, card1 2300–2900, count 03 2400–3000 */
  drawArrow('arrow1', 'arrow1head', t, 2100, 2500);
  slideCard('card1', t, 2300, 2900, 60);
  document.getElementById('count03').textContent =
    String(Math.round(3 * easeOut(seg(t, 2400, 3000)))).padStart(2, '0');

  /* 7. arrow 2 draw 2600–3000, card2 2800–3400, count 97 2900–3600 */
  drawArrow('arrow2', 'arrow2head', t, 2600, 3000);
  slideCard('card2', t, 2800, 3400, 60);
  document.getElementById('count97').textContent =
    String(Math.round(97 * easeOut(seg(t, 2900, 3600)))).padStart(2, '0');
}

function drawArrow(lineId, headId, t, a, b) {
  const p = easeOut(seg(t, a, b));
  const line = document.getElementById(lineId);
  const len = line.getTotalLength();
  line.setAttribute('stroke-dasharray', len);
  line.setAttribute('stroke-dashoffset', len * (1 - p));
  line.setAttribute('opacity', p > 0 ? 1 : 0);
  document.getElementById(headId).setAttribute('opacity', clamp01(seg(t, b - 80, b)));
}

function slideCard(id, t, a, b, dist) {
  const p = easeOut(seg(t, a, b));
  const el = document.getElementById(id);
  el.setAttribute('opacity', p);
  el.setAttribute('transform', `translate(${(1 - p) * dist} 0)`);
}

window.seek = seek;
seek(0);
/* live preview when opened by hand: */
if (new URLSearchParams(location.search).has('play')) {
  const t0 = performance.now();
  (function loop() {
    seek(Math.min(performance.now() - t0, 4500));
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
